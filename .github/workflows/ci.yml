name: Java CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [MYSQL, MARIADB]
        target: [MYSQL, MARIADB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: java -jar cdc-server/target/cdc-server-0.1.0-SNAPSHOT.jar
      - run: bash scripts/mysql-smoke.sh
        env:
          CDC_TEST_SOURCE_TYPE: ${{ matrix.source }}
          CDC_TEST_TARGET_TYPE: ${{ matrix.target }}
